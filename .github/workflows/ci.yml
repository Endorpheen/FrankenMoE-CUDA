name: ci

# Integrity gate for pull requests into main. No weights, no inference, no GPU,
# no benchmark. Every check below runs from a clean checkout.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  integrity:
    name: tree, generated files, tools, architecture registry
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Python
        run: python3 --version
      - name: Model acceptance registry and regression policy
        run: |
          python3 tools/check-model-regressions.py --validate
          python3 tools/tests/test_model_regressions.py
      - name: Goose tree and ledger
        run: python3 tools/check-goose-tree.py
      - name: Edge0 pack validation
        run: python3 tools/tests/test_edge0_preflight.py
      - name: Terminal logging fallback
        run: python3 tools/tests/test_frankenmoe_console.py
      - name: Generated artefacts policy
        run: python3 tools/check-generated-files.py
      - name: Tracked python tools compile
        run: |
          files=$(git ls-files 'tools/*.py' 'experiments/*/tests/*.py')
          python3 -m py_compile $files
          echo "compiled $(echo "$files" | wc -l) python files"

  goose:
    name: Goose compose, typecheck, build
    runs-on: ubuntu-24.04
    env:
      GOOSE_URL: https://github.com/aardappel/goose/releases/download/v2026.4/goose-v2026.4-linux-x64.tar.gz
      GOOSE_SHA256: 559ad7572df89fcd1273512d8679528bcdf876c252ec1f31608d3808b24125b3
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the pinned Goose compiler
        run: |
          curl -fsSL --retry 3 "$GOOSE_URL" -o "$RUNNER_TEMP/goose.tar.gz"
          echo "${GOOSE_SHA256}  $RUNNER_TEMP/goose.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/goose"
          tar -xzf "$RUNNER_TEMP/goose.tar.gz" -C "$RUNNER_TEMP/goose" --strip-components=1
          test -x "$RUNNER_TEMP/goose/goose"
          echo "GOOSE=$RUNNER_TEMP/goose/goose" >> "$GITHUB_ENV"
      - name: Goose fast gate
        run: bash tools/check.sh fast
